    <script>
      // Terapkan tema sebelum paint untuk menghindari flash.
      // Default: GELAP (tema utama). Preferensi pengguna disimpan di localStorage.
      (function () {
        try {
          var stored = localStorage.getItem('rm-theme');
          var theme = stored === 'light' ? 'light' : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* localStorage tidak tersedia: pakai default gelap */
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
